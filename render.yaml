services:
  - type: web
    name: hookah-driver-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    # Migrations run on start because pre-deploy commands are not available on the free plan.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*" --timeout-graceful-shutdown 10
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      # PostgreSQL hosted on Neon; set the connection string in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: FRONTEND_URL
        value: https://hookah-driver.vercel.app
      - key: APP_BASE_URL
        value: https://hookah-driver-api.onrender.com
      - key: MERCADO_PAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADO_PAGO_PUBLIC_KEY
        sync: false
      - key: MERCADO_PAGO_WEBHOOK_SECRET
        sync: false
      - key: MERCADO_PAGO_API_BASE_URL
        value: https://api.mercadopago.com
